<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101c24"><title>若陀龍王の嫁検定</title><style>
:root{color-scheme:dark;--gold:#e6c58a;--bg:#101c24;--panel:#1b3038;--line:#48626a;--text:#f3ead9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#28454a,#101c24 68%);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;min-height:100dvh}main{max-width:690px;margin:auto;padding:22px 16px 60px}.hero{text-align:center;padding:22px 0 12px}.eyebrow{color:var(--gold);letter-spacing:.24em;font-size:12px}.dragon{font-size:68px;filter:drop-shadow(0 0 18px #ba8b4e88);line-height:1.4}h1{font-size:clamp(27px,7vw,42px);margin:6px 0;color:var(--gold)}h2{font-size:22px;margin:0 0 14px}p{line-height:1.8}.sub{opacity:.78}.panel{border:1px solid var(--line);background:#1b3038e8;border-radius:20px;padding:22px;box-shadow:0 16px 45px #0005;margin-top:18px}.hidden{display:none!important}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #e9cc93;outline-offset:3px}.primary{background:linear-gradient(125deg,#f1d49e,#bb9254);color:#18242a;border:0;border-radius:12px;padding:15px 20px;font-weight:800;width:100%;margin-top:16px}.secondary{border:1px solid #8eaaab;color:#f2e7d3;background:transparent;border-radius:12px;padding:12px 15px}.answers{display:grid;gap:10px;margin:22px 0}.answer{text-align:left;background:#263d45;border:1px solid #577078;border-radius:13px;padding:16px;color:var(--text);min-height:56px}.answer:not(:disabled):active{transform:scale(.99)}.answer:disabled{cursor:default;opacity:1}.answer.correct{background:#1c5547;border-color:#78d4aa}.answer.wrong{background:#633b3d;border-color:#ed9990}.answer span{color:var(--gold);margin-right:12px;font-weight:800}.topline{display:flex;justify-content:space-between;gap:8px;color:#d9c69e;font-size:13px}.bar{height:8px;background:#0c1c22;border-radius:9px;overflow:hidden;margin:14px 0 26px}.fill{height:100%;width:0;background:linear-gradient(90deg,#9b7744,#f1d7a5);transition:width .25s}.feedback{background:#11262c;border-left:3px solid var(--gold);padding:15px;border-radius:8px;line-height:1.7}.score{font-size:54px;color:var(--gold);font-weight:900;text-align:center}.rank{text-align:center;font-size:26px;color:var(--gold);font-weight:800}.center{text-align:center}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.actions button{width:100%}footer{font-size:12px;opacity:.65;text-align:center;line-height:1.7;margin-top:25px}@media(max-width:430px){.panel{padding:17px}.actions{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><header class="hero"><div class="eyebrow">龍王公認（自称）・特別試験</div><div class="dragon" aria-hidden="true">🐉</div><h1>若陀龍王の嫁検定</h1><div class="sub">〜真の伴侶への試練〜</div></header>
<section class="panel" id="start"><h2>夫のこと、どこまで知っている？</h2><p>基礎5問・上級10問・最終試練5問。合計20問の難関検定に挑もう！ 問題と選択肢の順番は毎回変化。全問正解で最高称号を獲得できる。</p><p class="sub">※称号・龍王のコメントはファン制作のジョークです。原作の公式台詞ではありません。</p><button class="primary" id="startBtn">試練を開始する</button></section>
<section class="panel hidden" id="game" aria-live="polite"><div class="topline"><strong id="stage"></strong><span id="counter"></span></div><div class="bar"><div class="fill" id="fill"></div></div><h2 id="question"></h2><div class="answers" id="answers"></div><div id="feedback" class="feedback hidden" role="status"></div><button id="nextBtn" class="primary hidden">次の問題へ</button></section>
<section class="panel hidden" id="result"><div class="eyebrow center">試練終了・伴侶認定証</div><div class="score" id="score"></div><div class="rank" id="rank"></div><p class="center" id="message"></p><p class="center sub" id="breakdown"></p><div class="actions"><button class="secondary" id="shareBtn">Xに結果をシェア</button><button class="secondary" id="copyBtn">結果をコピー</button></div><button class="primary" id="restartBtn">新しい試練に挑戦</button><p class="center sub" id="copyStatus" role="status"></p></section>
<footer>非公式ファン制作ゲーム。原神・若陀龍王は各権利者に帰属します。<br>外部画像・音声・ライブラリは使用していません。</footer></main><script>
'use strict';const BANK=[{"stage":1,"q":"若陀龍王が封印されている場所にある巨木の名前は？","opts":["伏龍の木","忍冬の樹","神櫻","夢見の木"],"ans":0,"exp":"南天門の「伏龍の木」の地下に若陀龍王が封印されている。"},{"stage":1,"q":"若陀龍王と深い因縁を持つ岩神は？","opts":["バルバトス","モラクス","バアル","ブエル"],"ans":1,"exp":"モラクス（鍾離）と若陀龍王の関係は、鍾離の伝説任務第二幕で描かれる。"},{"stage":1,"q":"若陀龍王と戦う週ボス秘境の名称は？","opts":["黄金屋","伏龍の木の底","鳴神島・天守","夢想楽土の結末"],"ans":1,"exp":"若陀龍王の週ボス戦は「伏龍の木の底」。"},{"stage":1,"q":"若陀龍王の基本となる元素は？","opts":["岩","草","風","雷"],"ans":0,"exp":"若陀龍王は岩元素を基盤とし、戦闘中に別の元素の力も取り込む。"},{"stage":1,"q":"若陀龍王が登場する鍾離の伝説任務は？","opts":["第一幕","第二幕","第三幕","デートイベント"],"ans":1,"exp":"鍾離の伝説任務「古聞の章・第二幕」で若陀龍王の物語が描かれる。"},{"stage":2,"q":"週ごとに変わる若陀龍王の元素の組み合わせとして存在しないものは？","opts":["水＋雷","炎＋氷","水＋氷","氷＋雷"],"ans":3,"exp":"実装されている組み合わせは水＋雷、炎＋氷、水＋氷、炎＋雷の4種類。"},{"stage":2,"q":"週ボス戦で若陀龍王が取り込む元素に含まれないのは？","opts":["水","氷","草","炎"],"ans":2,"exp":"取り込むのは水・炎・氷・雷の4元素。草元素は含まれない。"},{"stage":2,"q":"若陀龍王が元素形態へ移行する際の危険な行動は？","opts":["連続して地面を踏み鳴らす","空中へ長時間飛ぶ","分身を4体作る","回復の結界を展開する"],"ans":0,"exp":"形態移行時の連続踏みつけは広範囲に及ぶため、距離を取るのが基本。"},{"stage":2,"q":"若陀龍王の元素攻撃で、シールドがないと受けることがある効果は？","opts":["継続的な元素ダメージ","元素爆発の即時回復","最大HPの永続上昇","スタミナ上限の増加"],"ans":0,"exp":"一部の元素攻撃をシールドなしで受けると印が付き、継続的な元素ダメージを受ける。"},{"stage":2,"q":"若陀龍王が落とす天賦育成素材は？","opts":["龍王の冠","東風の爪","魔王の刃・残片","灰燼の心"],"ans":0,"exp":"「龍王の冠」は若陀龍王の天賦育成素材の一つ。"},{"stage":2,"q":"次のうち若陀龍王の天賦育成素材は？","opts":["血玉の枝","北風のしっぽ","東風の羽根","武煉の魂・孤影"],"ans":0,"exp":"「血玉の枝」は若陀龍王の固有ドロップ素材。"},{"stage":2,"q":"次のうち若陀龍王の天賦育成素材は？","opts":["鍍金の鱗","地脈の旧枝","常燃の火種","浄水の心"],"ans":0,"exp":"「鍍金の鱗」は若陀龍王の固有ドロップ素材。"},{"stage":2,"q":"若陀龍王の天賦素材「鍍金の鱗」を使うキャラクターは？","opts":["楓原万葉","神里綾華","宵宮","煙緋"],"ans":0,"exp":"楓原万葉は「鍍金の鱗」を使う。綾華と煙緋は血玉の枝、宵宮は龍王の冠。"},{"stage":2,"q":"若陀龍王の天賦素材「血玉の枝」を使うキャラクターは？","opts":["早柚","夜蘭","神里綾華","エウルア"],"ans":2,"exp":"神里綾華は「血玉の枝」を使う。"},{"stage":2,"q":"若陀龍王の天賦素材「龍王の冠」を使うキャラクターは？","opts":["宵宮","楓原万葉","煙緋","夜蘭"],"ans":0,"exp":"宵宮は「龍王の冠」を使う。"},{"stage":3,"q":"若陀龍王の善良な意識の側面として登場する人物は？","opts":["阿鳩","昆鈞","志璇","淮安"],"ans":1,"exp":"昆鈞は若陀龍王の善良な意識の側面を表す。"},{"stage":3,"q":"若陀龍王の憎悪の側面として登場するのは？","opts":["阿鳩","昆鈞","嵐姉","鶯児"],"ans":0,"exp":"阿鳩は若陀龍王の憎悪の側面を表す。"},{"stage":3,"q":"若陀龍王の元素組み合わせのうち、実装されているものは？","opts":["雷＋氷","炎＋雷","炎＋水","氷＋草"],"ans":1,"exp":"炎＋雷は実装された4つの組み合わせの一つ。"},{"stage":3,"q":"若陀龍王の週ボス戦で、最初に取り込む元素として登場するのは？","opts":["雷または氷","水または炎","氷または草","風または岩"],"ans":1,"exp":"4つのパターンでは、最初に取り込む元素は水または炎。"},{"stage":3,"q":"若陀龍王の週ボス戦で、2番目に取り込む元素として登場するのは？","opts":["水または炎","岩または風","雷または氷","草または水"],"ans":2,"exp":"4つのパターンでは、2番目に取り込む元素は雷または氷。"}];const $=id=>document.getElementById(id);let quiz=[],index=0,score=0,stageScores=[0,0,0],locked=false;
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function show(id){for(const key of ['start','game','result'])$(key).classList.toggle('hidden',key!==id)}
function begin(){quiz=[1,2,3].flatMap(stage=>shuffle(BANK.filter(q=>q.stage===stage)).map(q=>{const options=shuffle(q.opts.map((text,i)=>({text,correct:i===q.ans})));return {...q,options}}));index=0;score=0;stageScores=[0,0,0];show('game');render()}
function render(){locked=false;const q=quiz[index];$('stage').textContent=['','第一段階・基礎','第二段階・上級','最終段階・龍王の試練'][q.stage];$('counter').textContent=`${index+1} / ${quiz.length} 問`;$('fill').style.width=`${(index+1)/quiz.length*100}%`;$('question').textContent=q.q;$('feedback').classList.add('hidden');$('nextBtn').classList.add('hidden');$('nextBtn').textContent=index===quiz.length-1?'認定結果を見る':'次の問題へ';$('answers').replaceChildren();q.options.forEach((opt,i)=>{const b=document.createElement('button');b.className='answer';const mark=document.createElement('span');mark.textContent='ABCD'[i];b.append(mark,document.createTextNode(opt.text));b.addEventListener('click',()=>answer(i));$('answers').append(b)})}
function answer(i){if(locked)return;locked=true;const q=quiz[index],chosen=q.options[i],buttons=[...$('answers').children];if(chosen.correct){score++;stageScores[q.stage-1]++}buttons.forEach((b,j)=>{b.disabled=true;if(q.options[j].correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('feedback').textContent=(chosen.correct?'正解！ さすがは龍王の伴侶。':'不正解！ 夫の研究はまだ終わらない。')+'\n'+q.exp;$('feedback').style.whiteSpace='pre-line';$('feedback').classList.remove('hidden');$('nextBtn').classList.remove('hidden')}
function rankFor(n){return n===20?['龍王が認めし唯一の伴侶','完璧な理解。龍王も驚くほどの知識！']:n>=17?['伏龍の木の最愛の伴侶','あと一歩で伝説級！']:n>=13?['龍王を知り尽くす者','かなりの龍王通。誇ってよし！']:n>=8?['龍王の伴侶候補','愛は十分。知識はまだ伸びる！']:['龍王の花嫁修行中','愛情は満点。今こそ再挑戦！']}
function finish(){show('result');const [rank,msg]=rankFor(score);$('score').textContent=`${score} / 20`;$('rank').textContent=rank;$('message').textContent=msg;$('breakdown').textContent=`基礎 ${stageScores[0]}/5 ・ 上級 ${stageScores[1]}/10 ・ 最終試練 ${stageScores[2]}/5`;$('copyStatus').textContent=''}
function shareText(){return `🐉 若陀龍王の嫁検定 🐉\n結果：${score}/20問正解\n称号：${rankFor(score)[0]}\n#原神 #若陀龍王`}
$('startBtn').addEventListener('click',begin);$('nextBtn').addEventListener('click',()=>{if(index===quiz.length-1)finish();else{index++;render()}});$('restartBtn').addEventListener('click',begin);$('shareBtn').addEventListener('click',()=>{const url='https://twitter.com/intent/tweet?text='+encodeURIComponent(shareText())+(location.protocol.startsWith('http')?'&url='+encodeURIComponent(location.href):'');window.open(url,'_blank','noopener,noreferrer')});$('copyBtn').addEventListener('click',async()=>{try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(shareText())}else{const ta=document.createElement('textarea');ta.value=shareText();ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();if(!document.execCommand('copy'))throw Error('copy');ta.remove()}$('copyStatus').textContent='結果をコピーしました！'}catch(e){$('copyStatus').textContent='コピーできませんでした。Xシェアをご利用ください。'}});
</script></body></html>
