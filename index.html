<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151c1c"><title>若陀龍王の嫁検定</title>
<style>
:root{--gold:#e8c487;--bg:#111a1d;--panel:#203139;--line:#586d70;--text:#f7eddd}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top,#354b4a,#111a1d 70%);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}
main{max-width:700px;margin:auto;padding:20px 15px 60px}.hero{text-align:center;padding:22px 0}.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--gold)}
.dragon{font-size:65px}h1{color:var(--gold);font-size:clamp(27px,7vw,43px);margin:4px 0}h2{font-size:22px;line-height:1.6}p{line-height:1.8}.sub{opacity:.8}
.panel{border:1px solid var(--line);background:#203139f2;border-radius:20px;padding:22px;box-shadow:0 16px 45px #0005;margin-top:16px}.hidden{display:none!important}

.primary{background:linear-gradient(125deg,#f1d49e,#bb9254);color:#18242a;border:0;border-radius:12px;padding:15px 20px;font-weight:800;width:100%;margin-top:16px}
.secondary{border:1px solid #8eaaab;color:#f2e7d3;background:transparent;border-radius:12px;padding:12px 15px}
.answers{display:grid;gap:10px;margin:20px 0}.answer{text-align:left;background:#293f46;border:1px solid #637b7c;border-radius:13px;padding:16px;color:var(--text);min-height:56px}
.answer:disabled{cursor:default;opacity:1}.answer.correct{background:#1c5547;border-color:#78d4aa}.answer.wrong{background:#633b3d;border-color:#ed9990}
.answer span{color:var(--gold);margin-right:12px;font-weight:800}.topline{display:flex;justify-content:space-between;gap:8px;color:#e6cfa2;font-size:13px}
.bar{height:8px;background:#0c1c22;border-radius:9px;overflow:hidden;margin:14px 0 26px}.fill{height:100%;width:0;background:linear-gradient(90deg,#9b7744,#f1d7a5);transition:width .25s}

.score{font-size:54px;color:var(--gold);font-weight:900;text-align:center}.rank{text-align:center;font-size:27px;color:var(--gold);font-weight:800}.center{text-align:center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.actions button{width:100%}
.question-image{display:block;width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:#142329;margin:10px auto 18px}
.image-note{color:#d8c69d;font-size:12px;margin:-10px 0 12px}

@media(max-width:430px){.panel{padding:17px}.actions{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main>
<header class="hero"><div class="eyebrow">龍王公認（自称）・特別試験</div><div class="dragon" aria-hidden="true">🐉</div><h1>若陀龍王の嫁検定</h1><div class="sub">〜真の伴侶への試練〜</div></header>
<section class="panel" id="start"><h2>夫のこと、どこまで知っている？</h2><p>基礎5問・上級10問・最終試練5問。全40問の問題バンクから毎回20問をランダム出題！ 選択肢の順番も変わるよ。</p><p class="sub">※称号・龍王のコメントはファン制作のジョークです。原作の公式台詞ではありません。</p><button class="primary" id="startBtn">試練を開始する</button></section>
<section class="panel hidden" id="game" aria-live="polite"><div class="topline"><strong id="stage"></strong><span id="counter"></span></div><div class="bar"><div class="fill" id="fill"></div></div><img id="questionImage" class="question-image hidden" alt=""><p id="imageNote" class="image-note hidden"></p><h2 id="question"></h2><div class="answers" id="answers"></div><div id="feedback" class="feedback hidden" role="status"></div><button id="nextBtn" class="primary hidden">次の問題へ</button></section>
<section class="panel hidden" id="result"><div class="eyebrow center">試練終了・伴侶認定証</div><div class="score" id="score"></div><div class="rank" id="rank"></div><p class="center" id="message"></p><p class="center sub" id="breakdown"></p><div class="actions"><button class="secondary" id="shareBtn">Xに結果をシェア</button><button class="secondary" id="copyBtn">結果をコピー</button></div><button class="primary" id="restartBtn">新しい試練に挑戦</button><p class="center sub" id="copyStatus" role="status"></p></section>
<footer>非公式ファン制作ゲーム。原神・若陀龍王は各権利者に帰属します。画像は権利者の利用条件に従ってください。</footer>
</main><script>
'use strict';
const BANK=[{"stage":1,"q":"若陀龍王が封印されている場所にある巨木の名前は？","opts":["伏龍の木","忍冬の樹","神櫻","夢見の木"],"ans":0,"exp":"南天門の「伏龍の木」の地下に封印されている。","id":1},{"stage":1,"q":"若陀龍王と深い因縁を持つ岩神は？","opts":["バルバトス","モラクス","バアル","ブエル"],"ans":1,"exp":"モラクス（鍾離）と若陀龍王の過去は「匪石」で描かれる。","id":2},{"stage":1,"q":"若陀龍王と戦う週ボス秘境の名称は？","opts":["黄金屋","「伏龍の木」の底","鳴神島・天守","夢想楽土の結末"],"ans":1,"exp":"若陀龍王の週ボス秘境は「伏龍の木」の底。","id":3},{"stage":1,"q":"若陀龍王の基本となる元素は？","opts":["岩","草","風","雷"],"ans":0,"exp":"若陀龍王は岩元素の龍。","id":4},{"stage":1,"q":"若陀龍王が登場する鍾離の伝説任務は？","opts":["古聞の章・第一幕","古聞の章・第二幕","古聞の章・第三幕","デートイベント"],"ans":1,"exp":"古聞の章・第二幕「匪石」に登場する。","id":5},{"stage":1,"q":"若陀龍王が封印されている地域は？","opts":["南天門","軽策荘","孤雲閣","帰離原"],"ans":0,"exp":"伏龍の木は南天門にある。","id":6},{"stage":1,"q":"若陀龍王が週ボス戦で取り込むことのない元素は？","opts":["水","雷","草","氷"],"ans":2,"exp":"取り込む元素は水・炎・雷・氷。","id":7},{"stage":1,"q":"若陀龍王との戦闘を解放する伝説任務の正式名称は？","opts":["古聞の章・第二幕「匪石」","古聞の章・第一幕「塩の花」","金翼鵬王の章「儺佑の夢」","天下人の章「須臾百夢」"],"ans":0,"exp":"古聞の章・第二幕「匪石」。","id":8},{"stage":1,"q":"若陀龍王がかつてモラクスと共に戦ったのは？","opts":["魔神戦争","カーンルイアの厄災","漆黒の災厄","魔女会の集会"],"ans":0,"exp":"魔神戦争で共に戦った。","id":9},{"stage":1,"q":"若陀龍王がモラクスと袂を分かつ原因に関係するのは？","opts":["地脈への干渉と摩耗","海流の逆転","仙人の失踪","月の満ち欠け"],"ans":0,"exp":"地脈への干渉と摩耗が深く関係する。","id":10},{"stage":2,"q":"週ごとに変わる若陀龍王の元素の組み合わせとして存在しないものは？","opts":["水＋雷","炎＋氷","水＋氷","氷＋雷"],"ans":3,"exp":"氷＋雷は存在しない。","id":11},{"stage":2,"q":"若陀龍王が元素形態へ移行する際の危険な行動は？","opts":["連続して地面を踏み鳴らす","空中へ長時間飛ぶ","分身を4体作る","回復の結界を展開する"],"ans":0,"exp":"形態移行時には連続踏み鳴らしを行う。","id":12},{"stage":2,"q":"若陀龍王の元素攻撃でシールドがないと受けることがある効果は？","opts":["元素の印と継続ダメージ","元素爆発の即時回復","最大HPの永続上昇","スタミナ上限の増加"],"ans":0,"exp":"元素の印によって継続ダメージを受ける。","id":13},{"stage":2,"q":"若陀龍王の天賦育成素材として誤っているものは？","opts":["龍王の冠","血玉の枝","鍍金の鱗","東風の爪"],"ans":3,"exp":"東風の爪は若陀龍王の素材ではない。","id":14},{"stage":2,"q":"「血玉の枝」の説明文によると、結晶化した枝を成長させたものとして描かれている組み合わせは？","opts":["憎しみ・泉・冷たい月光","怒り・溶岩・灼熱の太陽","悲しみ・雨・星明かり","怨念・雷鳴・深い霧"],"ans":0,"exp":"憎しみ、泉、冷たい月光が描かれている。","id":15},{"stage":2,"q":"「鍍金の鱗」の説明文で、長い年月をかけて岩に埋め込まれたとされる2つの物質は？","opts":["黄金と琥珀","黄金と黒曜石","白銀と水晶","翡翠と黒曜石"],"ans":1,"exp":"黄金と黒曜石。","id":16},{"stage":2,"q":"「龍王の冠」の説明文によると、金色の長い角は若陀龍王の力が何に匹敵する証とされている？","opts":["七神すべてを合わせた力","天理の調停者","過去のとある君主","古代の仙人たち"],"ans":2,"exp":"過去のとある君主に匹敵する力。","id":17},{"stage":2,"q":"若陀龍王が元素を取り込む順番として正しいものは？","opts":["最初に水か炎、次に雷か氷","最初に雷か氷、次に水か炎","最初に岩、次に草","最初に風、次に岩"],"ans":0,"exp":"最初に水か炎、次に雷か氷。","id":18},{"stage":2,"q":"水元素形態で使用する攻撃は？","opts":["水弾と範囲攻撃","炎の火球","雷球のみ","風の竜巻"],"ans":0,"exp":"水弾などの攻撃を行う。","id":19},{"stage":2,"q":"炎元素形態で使用する攻撃は？","opts":["氷の槍","火球と燃焼する地面","水の波だけ","草の蔓"],"ans":1,"exp":"火球と燃焼する地面に注意。","id":20},{"stage":2,"q":"氷元素形態で使用する攻撃は？","opts":["雷の鎖","炎の輪","氷弾と範囲攻撃","草の種"],"ans":2,"exp":"氷弾などの攻撃を行う。","id":21},{"stage":2,"q":"雷元素形態で使用する攻撃は？","opts":["落雷と雷球","水の渦のみ","炎の壁","風の刃"],"ans":0,"exp":"落雷と雷球などの攻撃を行う。","id":22},{"stage":2,"q":"若陀龍王が取り込んだ元素について、耐性はどうなる？","opts":["その元素への耐性が上昇する","耐性がゼロになる","全耐性が下がる","変化しない"],"ans":0,"exp":"取り込んだ元素への耐性が上昇する。","id":23},{"stage":2,"q":"若陀龍王の「元素の印」について誤っている説明は？","opts":["シールドなしで元素攻撃を受けると印が付くことがある","印が付くと継続的な元素ダメージを受ける","キャラクターを交代すれば必ず解除される","シールドで元素攻撃を防ぐと印の付与を避けられる"],"ans":2,"exp":"交代だけで必ず解除されるわけではない。","id":24},{"stage":2,"q":"地中へ潜って尻尾だけを残す攻撃について正しい説明は？","opts":["地中を移動しながら岩を降らせ各地から飛び出す","雷元素形態では尻尾から扇状に雷元素攻撃を放つ","氷元素形態では水元素の波を発生させる","尻尾が出ている間はダメージを与えられない"],"ans":1,"exp":"雷元素形態では扇状の雷元素攻撃を放つ。","id":25},{"stage":2,"q":"尻尾だけを地上に残した状態でHPをゼロにした場合は？","opts":["その場で討伐完了","HPが回復して最初から再開","地上に姿を現した後さらに一撃が必要","元素を使わない形態に戻る"],"ans":2,"exp":"地上に現れた後さらに一撃が必要。","id":26},{"stage":2,"q":"若陀龍王の天賦育成素材「血玉の枝」が生えていた場所は？","opts":["背中","頭部","尻尾","心臓"],"ans":0,"exp":"背中とする採用済み設問。原文との照合は未完了。","id":27},{"stage":2,"q":"若陀龍王が戦闘中に発する台詞は？","opts":["千年の怒りは、決して消えぬ！","大地の憤怒は…静まらぬ！","岩の契約に、終わりはない！","我が咆哮を、天地に刻め！"],"ans":1,"exp":"採用済みの台詞問題。原文照合は未完了。","id":28},{"stage":2,"q":"若陀龍王の週ボス戦で、元素形態として取り込む組み合わせは？","opts":["炎＋草","氷＋水","風＋岩","草＋雷"],"ans":1,"exp":"氷＋水の組み合わせが存在する。画像なしでも成立するよう改題。","id":29},{"stage":2,"q":"若陀龍王戦でシールドが特に有効な理由は？","opts":["元素の印と継続ダメージを防ぐため","攻撃をすべて反射できるため","元素形態を無効化できるため","戦闘時間を止められるため"],"ans":0,"exp":"元素の印を防ぐのに役立つ。","id":30},{"stage":3,"q":"若陀龍王の善良な意識の側面として登場する人物は？","opts":["阿鳩","昆鈞","志璇","淮安"],"ans":1,"exp":"昆鈞。","id":31},{"stage":3,"q":"若陀龍王の憎悪の側面として登場するのは？","opts":["阿鳩","昆鈞","嵐姉","鶯児"],"ans":0,"exp":"阿鳩。","id":32},{"stage":3,"q":"若陀龍王が封印された際の本人の意思について正しい説明は？","opts":["最後まで拒絶し力尽きたところを封じられた","自ら封印を受け入れたが摩耗によって記憶を失った","自分の記憶を消すよう求めた","封印された事実を最初から知らなかった"],"ans":1,"exp":"封印を受け入れたが摩耗で記憶を失った。","id":33},{"stage":3,"q":"「鎮龍石」はどのような経緯で生まれた？","opts":["モラクスが目を与えた際","若陀龍王が地上に現れた際","モラクスと若陀龍王が戦った際","封印から目覚めた際"],"ans":2,"exp":"モラクスと若陀龍王が戦った際。","id":34},{"stage":3,"q":"封印について記した石碑を建てた仙人は？","opts":["削月築陽真君","理水畳山真君","留雲借風真君","歌塵浪市真君"],"ans":1,"exp":"理水畳山真君とする採用済み設問。","id":35},{"stage":3,"q":"「匪石」で昆鈞が鉱石から読み取れるものは？","opts":["鉱石が記録した周囲の出来事","鉱石の未来","採掘した人物の寿命","元素力の総量"],"ans":0,"exp":"鉱石に残る周囲の出来事。","id":36},{"stage":3,"q":"阿鳩は若陀龍王の封印に対して何をしようとした？","opts":["封印を破り若陀龍王を解放する","封印を別の土地へ移す","封印を永遠に強化する","仙人を集めて守る"],"ans":0,"exp":"封印を破って解放しようとした。","id":37},{"stage":3,"q":"若陀龍王の誕生について、伝承と実際の設定を踏まえ正しいものは？","opts":["モラクスが何もない岩から生命を創造した","モラクスと出会う以前から存在し地上へ導かれ目を与えられた","仙人たちが岩元素を集めて生んだ","人間から龍へ変化した"],"ans":1,"exp":"若陀龍王は以前から存在し、モラクスによって地上へ導かれ目を与えられた。","id":38},{"stage":3,"q":"「匪石」で失踪した鉱夫たちが発見された際、何をしていた？","opts":["若陀龍王の封印を掘り進めていた","鎮龍石を採掘していた","地脈の異常を調査していた","古代の石碑を修復していた"],"ans":0,"exp":"封印を掘り進めていた。","id":39},{"stage":3,"q":"「匪石」で昆鈞が鍾離に見せ、鍾離が正体を見抜いた鉱石は？","opts":["夜泊石","石珀","水入り水晶","老石"],"ans":2,"exp":"水入り水晶。","id":40}];
const $=id=>document.getElementById(id);
let quiz=[],index=0,score=0,stageScores=[0,0,0],locked=false;
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function show(id){for(const key of ['start','game','result'])$(key).classList.toggle('hidden',key!==id)}
function begin(){quiz=[1,2,3].flatMap(stage=>shuffle(BANK.filter(q=>q.stage===stage)).slice(0,stage===2?10:5).map(q=>({...q,options:shuffle(q.opts.map((text,i)=>({text,correct:i===q.ans})))})));index=0;score=0;stageScores=[0,0,0];show('game');render()}
function render(){locked=false;const q=quiz[index];$('stage').textContent=['','第一段階・基礎','第二段階・上級','最終段階・龍王の試練'][q.stage];$('counter').textContent=`${index+1} / ${quiz.length} 問`;$('fill').style.width=`${(index+1)/quiz.length*100}%`;$('question').textContent=q.q;
const im=$('questionImage'),note=$('imageNote');im.classList.add('hidden');note.classList.add('hidden');im.removeAttribute('src');
if(q.id===5||q.id===38){const path=q.id===5?'images/q05.png':'images/q38.png';im.onload=()=>{im.classList.remove('hidden');note.classList.add('hidden')};im.onerror=()=>{im.classList.add('hidden');note.textContent='※対応画像がまだ登録されていません';note.classList.remove('hidden')};im.alt=q.id===5?'伝説任務「匪石」のゲーム内画像':'若陀龍王に目を与える伝承のゲーム内画像';im.src=path}
$('feedback').classList.add('hidden');$('nextBtn').classList.add('hidden');$('nextBtn').textContent=index===quiz.length-1?'認定結果を見る':'次の問題へ';$('answers').replaceChildren();
q.options.forEach((opt,i)=>{const b=document.createElement('button');b.className='answer';const mark=document.createElement('span');mark.textContent='ABCD'[i];b.append(mark,document.createTextNode(opt.text));b.addEventListener('click',()=>answer(i));$('answers').append(b)})}
function answer(i){if(locked)return;locked=true;const q=quiz[index],chosen=q.options[i],buttons=[...$('answers').children];if(chosen.correct){score++;stageScores[q.stage-1]++}buttons.forEach((b,j)=>{b.disabled=true;if(q.options[j].correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('feedback').textContent=(chosen.correct?'正解！ さすがは龍王の伴侶。':'不正解！ 夫の研究はまだ終わらない。')+'\n'+q.exp;$('feedback').style.whiteSpace='pre-line';$('feedback').classList.remove('hidden');$('nextBtn').classList.remove('hidden')}
function rankFor(n){return n===20?['龍王が認めし唯一の伴侶','完璧な理解。龍王も驚くほどの知識！']:n>=17?['伏龍の木の最愛の伴侶','あと一歩で伝説級！']:n>=13?['龍王を知り尽くす者','かなりの龍王通。誇ってよし！']:n>=8?['龍王の伴侶候補','愛は十分。知識はまだ伸びる！']:['龍王の花嫁修行中','愛情は満点。今こそ再挑戦！']}
function finish(){show('result');const [rank,msg]=rankFor(score);$('score').textContent=`${score} / 20`;$('rank').textContent=rank;$('message').textContent=msg;$('breakdown').textContent=`基礎 ${stageScores[0]}/5 ・ 上級 ${stageScores[1]}/10 ・ 最終試練 ${stageScores[2]}/5`;$('copyStatus').textContent=''}
function shareText(){return `🐉 若陀龍王の嫁検定 🐉\n結果：${score}/20問正解\n称号：${rankFor(score)[0]}\n#原神 #若陀龍王`}
$('startBtn').addEventListener('click',begin);$('nextBtn').addEventListener('click',()=>{if(index===quiz.length-1)finish();else{index++;render()}});$('restartBtn').addEventListener('click',begin);
$('shareBtn').addEventListener('click',()=>{const url='https://twitter.com/intent/tweet?text='+encodeURIComponent(shareText())+(location.protocol.startsWith('http')?'&url='+encodeURIComponent(location.href):'');window.open(url,'_blank','noopener,noreferrer')});
$('copyBtn').addEventListener('click',async()=>{try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(shareText())}else{const ta=document.createElement('textarea');ta.value=shareText();ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();if(!document.execCommand('copy'))throw Error('copy');ta.remove()}$('copyStatus').textContent='結果をコピーしました！'}catch(e){$('copyStatus').textContent='コピーできませんでした。Xシェアをご利用ください。'}});
</script></body></html>
