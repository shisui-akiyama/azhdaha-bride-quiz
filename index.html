<style>
:root{
  color-scheme:dark;
  --gold:#f4cf77;--gold-deep:#a87829;
  --bg:#171611;--panel:#302a1f;--line:#8b713e;
  --text:#f7edda;--muted:#d8c9a9
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100dvh;color:var(--text);
  font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
  background:
    radial-gradient(ellipse at 50% -15%,#735b2caa,transparent 56%),
    repeating-linear-gradient(120deg,transparent 0 95px,#cda64b09 96px 98px,transparent 99px 170px),
    linear-gradient(145deg,#29261d,#141510 75%);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.24;
  background:
    linear-gradient(30deg,transparent 48%,#b69a5b24 49%,transparent 50%) 0 0/115px 115px,
    linear-gradient(150deg,transparent 48%,#b69a5b1c 49%,transparent 50%) 0 0/115px 115px;
}
main{position:relative;max-width:700px;margin:auto;padding:20px 15px 60px}
.hero{text-align:center;padding:28px 0 22px;position:relative}
.eyebrow{font-size:12px;letter-spacing:.22em;color:var(--gold)}
.dragon{display:flex;align-items:center;justify-content:center;margin:0 auto 8px;filter:drop-shadow(0 10px 22px #dba33c44)}.dragon-art{display:block;width:min(100%,390px);max-height:320px;object-fit:contain}
h1{color:var(--gold);font-size:clamp(27px,7vw,43px);margin:4px 0;text-shadow:0 2px 18px #e2a53a44}
h2{font-size:22px;line-height:1.6}p{line-height:1.8}.sub{color:var(--muted)}
.panel{
  border:1px solid var(--line);
  background:linear-gradient(155deg,#403623f5,#292820f5 70%);
  border-radius:18px;padding:22px;
  box-shadow:0 18px 48px #0008,inset 0 1px #f1d38b25;
  margin-top:16px;position:relative;overflow:hidden
}
.panel::before{
  content:"";position:absolute;top:0;left:24px;right:24px;height:2px;
  background:linear-gradient(90deg,transparent,#e8c779,transparent)
}
.hidden{display:none!important}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid #ffdf87;outline-offset:3px}
.primary{
  background:linear-gradient(125deg,#ffdf91,#d3a94f 55%,#a87b31);
  color:#2d2416;border:1px solid #f4d58a;border-radius:11px;
  padding:15px 20px;font-weight:800;width:100%;margin-top:16px;
  box-shadow:0 4px 16px #e0ae4025
}
.secondary{
  border:1px solid #b79a5d;color:#f7e5bc;
  background:#453820b8;border-radius:11px;padding:12px 15px
}
.answers{display:grid;gap:10px;margin:20px 0}
.answer{
  text-align:left;background:linear-gradient(110deg,#4c402b,#393329);
  border:1px solid #8b7448;border-radius:11px;padding:16px;
  color:var(--text);min-height:56px
}
.answer:not(:disabled):active{transform:scale(.99)}
.answer:disabled{cursor:default;opacity:1}
.answer.correct{background:#35533d;border-color:#a3d4a6}
.answer.wrong{background:#663a31;border-color:#e7a08c}
.answer span{color:var(--gold);margin-right:12px;font-weight:800}
.topline{display:flex;justify-content:space-between;gap:8px;color:#f0d28e;font-size:13px}
.bar{height:9px;background:#1b1a15;border:1px solid #75603c;border-radius:9px;overflow:hidden;margin:14px 0 26px}
.fill{height:100%;width:0;background:linear-gradient(90deg,#987132,#e5bb5b,#ffdf96);transition:width .25s}
.feedback{background:#28271e;border-left:3px solid var(--gold);padding:15px;border-radius:8px;line-height:1.7}
.score{font-size:54px;color:var(--gold);font-weight:900;text-align:center}
.rank{text-align:center;font-size:27px;color:var(--gold);font-weight:800}
.center{text-align:center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.actions button{width:100%}
.question-image{display:block;width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:#242117;margin:10px auto 18px;border:1px solid #7d673d}
.image-note{color:#e8c982;font-size:12px;margin:-10px 0 12px}
footer{font-size:12px;opacity:.72;text-align:center;line-height:1.7;margin-top:25px}
@media(max-width:430px){.panel{padding:17px}.actions{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

:0,"exp":"元素の印を防ぐのに役立つ。","id":30},{"stage":3,"q":"若陀龍王の善良な意識の側面として登場する人物は？","opts":["阿鳩","昆鈞","志璇","淮安"],"ans":1,"exp":"昆鈞。","id":31},{"stage":3,"q":"若陀龍王の憎悪の側面として登場するのは？","opts":["阿鳩","昆鈞","嵐姉","鶯児"],"ans":0,"exp":"阿鳩。","id":32},{"stage":3,"q":"若陀龍王が封印された際の本人の意思について正しい説明は？","opts":["最後まで拒絶し力尽きたところを封じられた","自ら封印を受け入れたが摩耗によって記憶を失った","自分の記憶を消すよう求めた","封印された事実を最初から知らなかった"],"ans":1,"exp":"封印を受け入れたが摩耗で記憶を失った。","id":33},{"stage":3,"q":"「鎮龍石」はどのような経緯で生まれた？","opts":["モラクスが目を与えた際","若陀龍王が地上に現れた際","モラクスと若陀龍王が戦った際","封印から目覚めた際"],"ans":2,"exp":"モラクスと若陀龍王が戦った際。","id":34},{"stage":3,"q":"封印について記した石碑を建てた仙人は？","opts":["削月築陽真君","理水畳山真君","留雲借風真君","歌塵浪市真君"],"ans":1,"exp":"理水畳山真君とする採用済み設問。","id":35},{"stage":3,"q":"「匪石」で昆鈞が鉱石から読み取れるものは？","opts":["鉱石が記録した周囲の出来事","鉱石の未来","採掘した人物の寿命","元素力の総量"],"ans":0,"exp":"鉱石に残る周囲の出来事。","id":36},{"stage":3,"q":"阿鳩は若陀龍王の封印に対して何をしようとした？","opts":["封印を破り若陀龍王を解放する","封印を別の土地へ移す","封印を永遠に強化する","仙人を集めて守る"],"ans":0,"exp":"封印を破って解放しようとした。","id":37},{"stage":3,"q":"若陀龍王の誕生について、伝承と実際の設定を踏まえ正しいものは？","opts":["モラクスが何もない岩から生命を創造した","モラクスと出会う以前から存在し地上へ導かれ目を与えられた","仙人たちが岩元素を集めて生んだ","人間から龍へ変化した"],"ans":1,"exp":"若陀龍王は以前から存在し、モラクスによって地上へ導かれ目を与えられた。","id":38},{"stage":3,"q":"「匪石」で失踪した鉱夫たちが発見された際、何をしていた？","opts":["若陀龍王の封印を掘り進めていた","鎮龍石を採掘していた","地脈の異常を調査していた","古代の石碑を修復していた"],"ans":0,"exp":"封印を掘り進めていた。","id":39},{"stage":3,"q":"「匪石」で昆鈞が鍾離に見せ、鍾離が正体を見抜いた鉱石は？","opts":["夜泊石","石珀","水入り水晶","老石"],"ans":2,"exp":"水入り水晶。","id":40}];
const $=id=>document.getElementById(id);
let quiz=[],index=0,score=0,stageScores=[0,0,0],locked=false;
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function show(id){for(const key of ['start','game','result'])$(key).classList.toggle('hidden',key!==id)}
function begin(){quiz=[1,2,3].flatMap(stage=>shuffle(BANK.filter(q=>q.stage===stage)).slice(0,stage===2?10:5).map(q=>({...q,options:shuffle(q.opts.map((text,i)=>({text,correct:i===q.ans})))})));index=0;score=0;stageScores=[0,0,0];show('game');render()}
function render(){locked=false;const q=quiz[index];$('stage').textContent=['','第一段階・基礎','第二段階・上級','最終段階・龍王の試練'][q.stage];$('counter').textContent=`${index+1} / ${quiz.length} 問`;$('fill').style.width=`${(index+1)/quiz.length*100}%`;$('question').textContent=q.q;
const im=$('questionImage'),note=$('imageNote');im.classList.add('hidden');note.classList.add('hidden');im.removeAttribute('src');
if(q.id===5||q.id===38){const path=q.id===5?'images/q05.png':'images/q38.png';im.onload=()=>{im.classList.remove('hidden');note.classList.add('hidden')};im.onerror=()=>{im.classList.add('hidden');note.textContent='※対応画像がまだ登録されていません';note.classList.remove('hidden')};im.alt=q.id===5?'伝説任務「匪石」のゲーム内画像':'若陀龍王に目を与える伝承のゲーム内画像';im.src=path}
$('feedback').classList.add('hidden');$('nextBtn').classList.add('hidden');$('nextBtn').textContent=index===quiz.length-1?'認定結果を見る':'次の問題へ';$('answers').replaceChildren();
q.options.forEach((opt,i)=>{const b=document.createElement('button');b.className='answer';const mark=document.createElement('span');mark.textContent='ABCD'[i];b.append(mark,document.createTextNode(opt.text));b.addEventListener('click',()=>answer(i));$('answers').append(b)})}
function answer(i){if(locked)return;locked=true;const q=quiz[index],chosen=q.options[i],buttons=[...$('answers').children];if(chosen.correct){score++;stageScores[q.stage-1]++}buttons.forEach((b,j)=>{b.disabled=true;if(q.options[j].correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('feedback').textContent=(chosen.correct?'正解！ さすがは龍王の伴侶。':'不正解！ 夫の研究はまだ終わらない。')+'\n'+q.exp;$('feedback').style.whiteSpace='pre-line';$('feedback').classList.remove('hidden');$('nextBtn').classList.remove('hidden')}
function rankFor(n){return n===20?['龍王が認めし唯一の伴侶','完璧な理解。龍王も驚くほどの知識！']:n>=17?['伏龍の木の最愛の伴侶','あと一歩で伝説級！']:n>=13?['龍王を知り尽くす者','かなりの龍王通。誇ってよし！']:n>=8?['龍王の伴侶候補','愛は十分。知識はまだ伸びる！']:['龍王の花嫁修行中','愛情は満点。今こそ再挑戦！']}
function finish(){show('result');const [rank,msg]=rankFor(score);$('score').textContent=`${score} / 20`;$('rank').textContent=rank;$('message').textContent=msg;$('breakdown').textContent=`基礎 ${stageScores[0]}/5 ・ 上級 ${stageScores[1]}/10 ・ 最終試練 ${stageScores[2]}/5`;$('copyStatus').textContent=''}
function shareText(){return `🐉 若陀龍王の嫁検定 🐉\n結果：${score}/20問正解\n称号：${rankFor(score)[0]}\n#原神 #若陀龍王`}
$('startBtn').addEventListener('click',begin);$('nextBtn').addEventListener('click',()=>{if(index===quiz.length-1)finish();else{index++;render()}});$('restartBtn').addEventListener('click',begin);
$('shareBtn').addEventListener('click',()=>{const url='https://twitter.com/intent/tweet?text='+encodeURIComponent(shareText())+(location.protocol.startsWith('http')?'&url='+encodeURIComponent(location.href):'');window.open(url,'_blank','noopener,noreferrer')});
$('copyBtn').addEventListener('click',async()=>{try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(shareText())}else{const ta=document.createElement('textarea');ta.value=shareText();ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();if(!document.execCommand('copy'))throw Error('copy');ta.remove()}$('copyStatus').textContent='結果をコピーしました！'}catch(e){$('copyStatus').textContent='コピーできませんでした。Xシェアをご利用ください。'}});
</script></body></html>
